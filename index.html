<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Record</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.header {
    background: #1f2937;
    color: white;
    padding: 22px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 6px;
    font-size: 28px;
}

.header p {
    margin: 0;
    opacity: 0.8;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.date-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #f1f5f9;
    padding: 12px;
    text-align: left;
}

td {
    padding: 8px;
    border-bottom: 1px solid #e5e7eb;
}

td:first-child {
    font-weight: bold;
}

.profit-loss {
    font-weight: bold;
}

.positive {
    color: #15803d;
}

.negative {
    color: #dc2626;
}

.summary {
    margin-top: 20px;
    border-radius: 12px;
    background: #f8fafc;
    padding: 18px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
    font-size: 17px;
}

.summary-row:last-child {
    border-bottom: none;
}

.summary-label {
    font-weight: bold;
}

.summary-value {
    font-weight: bold;
}

.operation-section {
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
}

.operation-title {
    font-weight: bold;
    margin-bottom: 12px;
}

.operation-line {
    display: flex;
    align-items: center;
    gap: 10px;
}

.operation-line select {
    width: 80px;
}

.operation-line input {
    max-width: 250px;
}

.final-row {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px solid #d1d5db;
    display: flex;
    justify-content: space-between;
    font-size: 21px;
    font-weight: bold;
}

.save-btn {
    background: #2563eb;
    color: white;
    width: 100%;
    margin-top: 20px;
}

.history-btn {
    background: #111827;
    color: white;
    width: 100%;
    margin-bottom: 15px;
}

.view-btn {
    background: #2563eb;
    color: white;
    padding: 8px 14px;
    font-size: 13px;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 8px 14px;
    font-size: 13px;
}

.edit-btn {
    background: #16a34a;
    color: white;
    padding: 8px 14px;
    font-size: 13px;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.history-item {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.history-date {
    font-weight: bold;
    font-size: 17px;
}

.history-actions {
    display: flex;
    gap: 8px;
}

.history-summary {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #e5e7eb;
}

.history-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
}

.history-total {
    border-top: 1px solid #ddd;
    margin-top: 10px;
    padding-top: 10px;
    font-size: 17px;
}

.history-details {
    display: none;
    margin-top: 15px;
    border-top: 1px solid #ddd;
    padding-top: 15px;
}

.detail-box {
    background: #f8fafc;
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 10px;
}

.detail-name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
}

.hidden {
    display: none;
}

.status {
    margin-top: 12px;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 700px) {

    .container {
        padding: 10px;
    }

    .header h1 {
        font-size: 22px;
    }

    .card {
        padding: 14px;
    }

    .summary-row {
        font-size: 15px;
    }

    .operation-line {
        flex-wrap: wrap;
    }

    .operation-line input {
        max-width: none;
        flex: 1;
    }

    .history-header {
        align-items: flex-start;
    }

    .history-actions {
        flex-direction: column;
    }
}
</style>
</head>
<body>
<div class="container">

```
<div class="header">
    <h1>Investment Record</h1>
    <p>Daily Value & Profit/Loss Management</p>
</div>

<div class="card">

    <div class="date-box">
        <strong>Date:</strong>

        <input
            type="date"
            id="entryDate"
            onchange="dateChanged()"
        >
    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Old Value</th>
                    <th>New Value</th>
                    <th>Profit/Loss</th>
                </tr>
            </thead>

            <tbody id="dataBody"></tbody>

        </table>

    </div>

    <div class="summary">

        <div class="summary-row">
            <span class="summary-label">
                Total Old Value
            </span>

            <span
                class="summary-value"
                id="totalOld"
            >
                0
            </span>
        </div>

        <div class="summary-row">
            <span class="summary-label">
                Total New Value
            </span>

            <span
                class="summary-value"
                id="totalNew"
            >
                0
            </span>
        </div>

        <div class="summary-row">
            <span class="summary-label">
                Total Profit/Loss
            </span>

            <span
                class="summary-value"
                id="totalProfitLoss"
            >
                0
            </span>
        </div>

        <div class="operation-section">

            <div class="operation-title">
                Profit/Loss Operation
            </div>

            <div class="operation-line">

                <select
                    id="operation"
                    onchange="calculateFinal()"
                >
                    <option value="+">+</option>
                    <option value="-">-</option>
                </select>

                <input
                    type="number"
                    id="operationAmount"
                    value="0"
                    placeholder="Enter amount"
                    oninput="calculateFinal()"
                >

            </div>

        </div>

        <div class="final-row">

            <span>
                Final Profit/Loss
            </span>

            <span id="finalProfitLoss">
                0
            </span>

        </div>

    </div>

    <button
        class="save-btn"
        onclick="saveData()"
    >
        SAVE ENTRY
    </button>

    <div
        class="status"
        id="status"
    ></div>

</div>

<div class="card">

    <button
        class="history-btn"
        onclick="toggleHistory()"
    >
        VIEW HISTORY
    </button>

    <div
        id="history"
        class="hidden"
    ></div>

</div>
```

</div>
<script>

const SUPABASE_URL =
"https://gcdbsywqwkreufaaouvx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EFsPnhS4H-KvWpngvKcPEQ_s4H-pkNN";

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const names = [
    "Prudent",
    "Mint",
    "PMS ICICI",
    "PMS CARNEL",
    "AIF",
    "Stocks"
];

document.getElementById("entryDate").value =
new Date().toISOString().split("T")[0];

createDefaultRows();
calculate();

function createDefaultRows() {

    const tbody =
    document.getElementById("dataBody");

    tbody.innerHTML = "";

    names.forEach(name => {
        addRow(name, 0, 0);
    });
}

function addRow(name, oldValue, newValue) {

    const tbody =
    document.getElementById("dataBody");

    const row =
    document.createElement("tr");

    row.innerHTML = `

        <td>
            <input
                type="text"
                class="name"
                value="${name}"
                readonly
            >
        </td>

        <td>
            <input
                type="number"
                class="oldValue"
                value="${oldValue}"
                oninput="calculate()"
            >
        </td>

        <td>
            <input
                type="number"
                class="newValue"
                value="${newValue}"
                oninput="calculate()"
            >
        </td>

        <td class="profit-loss">
            0
        </td>

    `;

    tbody.appendChild(row);
}

function number(value) {
    return Number(value) || 0;
}

function format(value) {

    return new Intl.NumberFormat(
        "en-IN"
    ).format(value);

}

function calculate() {

    let oldTotal = 0;
    let newTotal = 0;
    let profitLossTotal = 0;

    document
    .querySelectorAll("#dataBody tr")
    .forEach(row => {

        const oldValue =
        number(
            row.querySelector(".oldValue").value
        );

        const newValue =
        number(
            row.querySelector(".newValue").value
        );

        const profitLoss =
        newValue - oldValue;

        const cell =
        row.querySelector(".profit-loss");

        cell.textContent =
        format(profitLoss);

        cell.className =
        "profit-loss " +
        (
            profitLoss >= 0
            ? "positive"
            : "negative"
        );

        oldTotal += oldValue;
        newTotal += newValue;
        profitLossTotal += profitLoss;

    });

    document.getElementById("totalOld").textContent =
    format(oldTotal);

    document.getElementById("totalNew").textContent =
    format(newTotal);

    document.getElementById("totalProfitLoss").textContent =
    format(profitLossTotal);

    calculateFinal();
}

function calculateFinal() {

    const totalProfitLoss =
    getTotalProfitLoss();

    const operation =
    document.getElementById("operation").value;

    const amount =
    number(
        document.getElementById("operationAmount").value
    );

    let finalValue;

    if (operation === "+") {
        finalValue =
        totalProfitLoss + amount;
    } else {
        finalValue =
        totalProfitLoss - amount;
    }

    const finalElement =
    document.getElementById("finalProfitLoss");

    finalElement.textContent =
    format(finalValue);

    finalElement.className =
    finalValue >= 0
    ? "positive"
    : "negative";
}

function getTotalProfitLoss() {

    let total = 0;

    document
    .querySelectorAll("#dataBody tr")
    .forEach(row => {

        const oldValue =
        number(
            row.querySelector(".oldValue").value
        );

        const newValue =
        number(
            row.querySelector(".newValue").value
        );

        total +=
        newValue - oldValue;

    });

    return total;
}

async function dateChanged() {

    const selectedDate =
    document.getElementById("entryDate").value;

    if (!selectedDate) return;

    // First check whether this date already has saved entries.
    const { data: currentData, error: currentError } =
    await client
        .from("records")
        .select("*")
        .eq("entry_date", selectedDate)
        .order("created_at", { ascending: true });

    if (currentError) {
        alert("Date data load error: " + currentError.message);
        return;
    }

    // If entries exist for this date, show the exact saved Old and New values.
    if (currentData && currentData.length > 0) {
        loadSavedDateData(currentData);
        return;
    }

    // Otherwise, use the latest SAVED date before the selected date
    // and carry its New Value forward as this date's Old Value.
    const { data, error } =
    await client
        .from("records")
        .select("*")
        .lt("entry_date", selectedDate)
        .order("entry_date", { ascending: false })
        .order("created_at", { ascending: false });

    if (error) {
        alert("Previous data load error: " + error.message);
        return;
    }

    if (!data || data.length === 0) {
        createDefaultRows();
        document.getElementById("operationAmount").value = 0;
        document.getElementById("operation").value = "+";
        calculate();
        return;
    }

    const latestDate = data[0].entry_date;
    const latestRecords = data.filter(item => item.entry_date === latestDate);

    loadPreviousData(latestRecords);
}

function loadSavedDateData(records) {
    const tbody = document.getElementById("dataBody");
    tbody.innerHTML = "";

    names.forEach(name => {
        const saved = records.find(item => item.name === name);
        addRow(
            name,
            saved ? Number(saved.old_rate) : 0,
            saved ? Number(saved.new_rate) : 0
        );
    });

    document.getElementById("operationAmount").value = 0;
    document.getElementById("operation").value = "+";
    calculate();

    document.getElementById("status").textContent =
        "Saved entry loaded for " + document.getElementById("entryDate").value + ".";
}

function loadPreviousData(records) {

    const tbody =
    document.getElementById("dataBody");

    tbody.innerHTML = "";

    names.forEach(name => {

        const previous =
        records.find(
            item => item.name === name
        );

        if (previous) {

            addRow(
                name,
                previous.new_rate,
                0
            );

        } else {

            addRow(
                name,
                0,
                0
            );

        }

    });

    document.getElementById(
        "operationAmount"
    ).value = 0;

    document.getElementById(
        "operation"
    ).value = "+";

    calculate();
}

async function saveData() {

    const date =
    document.getElementById("entryDate").value;

    if (!date) {

        alert("Please select date");

        return;
    }

    const rows = [];

    document
    .querySelectorAll("#dataBody tr")
    .forEach(row => {

        rows.push({

            entry_date: date,

            name:
            row.querySelector(".name").value,

            old_rate:
            number(
                row.querySelector(".oldValue").value
            ),

            new_rate:
            number(
                row.querySelector(".newValue").value
            ),

            investment: 0

        });

    });

    if (rows.length !== 6) {

        alert(
            "Exactly 6 records are required."
        );

        return;
    }

    document.getElementById("status").textContent =
    "Saving...";

    const { error: deleteError } =
    await client
    .from("records")
    .delete()
    .eq("entry_date", date);

    if (deleteError) {

        alert(
            "Error updating date: " +
            deleteError.message
        );

        document.getElementById("status").textContent =
        "";

        return;
    }

    const { error } =
    await client
    .from("records")
    .insert(rows);

    if (error) {

        alert(error.message);

        document.getElementById("status").textContent =
        "Error while saving";

        return;
    }

    document.getElementById("status").textContent =
    "Saved successfully ✓";

    alert(
        "Data saved successfully!"
    );

    loadHistory();
}

async function loadHistory() {

    const { data, error } =
    await client
    .from("records")
    .select("*")
    .order("entry_date", {
        ascending: false
    })
    .order("created_at", {
        ascending: false
    });

    if (error) {

        console.error(error);
        return;
    }

    const history =
    document.getElementById("history");

    history.innerHTML = "";

    const grouped = {};

    data.forEach(item => {

        if (!grouped[item.entry_date]) {
            grouped[item.entry_date] = [];
        }

        grouped[item.entry_date].push(item);

    });

    Object.keys(grouped).forEach(date => {

        let oldTotal = 0;
        let newTotal = 0;

        grouped[date].forEach(item => {

            oldTotal +=
            Number(item.old_rate);

            newTotal +=
            Number(item.new_rate);

        });

        const profitLoss =
        newTotal - oldTotal;

        const div =
        document.createElement("div");

        div.className =
        "history-item";

        div.innerHTML = `

            <div class="history-header">

                <div class="history-date">
                    ${date}
                </div>

                <div class="history-actions">

                    <button
                        class="view-btn"
                        onclick="viewHistory('${date}')"
                    >
                        VIEW
                    </button>

                    <button
                        class="edit-btn"
                        onclick="editHistory('${date}')"
                    >
                        EDIT
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteHistory('${date}')"
                    >
                        DELETE
                    </button>

                </div>

            </div>

            <div class="history-summary">

                <div class="history-row">

                    <span>
                        Total Old Value
                    </span>

                    <strong>
                        ${format(oldTotal)}
                    </strong>

                </div>

                <div class="history-row">

                    <span>
                        Total New Value
                    </span>

                    <strong>
                        ${format(newTotal)}
                    </strong>

                </div>

                <div class="history-row history-total">

                    <span>
                        Total Profit/Loss
                    </span>

                    <strong class="${
                        profitLoss >= 0
                        ? "positive"
                        : "negative"
                    }">
                        ${format(profitLoss)}
                    </strong>

                </div>

            </div>

            <div
                id="details-${date}"
                class="history-details"
            ></div>

        `;

        history.appendChild(div);

    });

}

async function viewHistory(date) {

    const details =
    document.getElementById(
        "details-" + date
    );

    if (
        details.style.display === "block"
    ) {

        details.style.display = "none";

        return;
    }

    const { data, error } =
    await client
    .from("records")
    .select("*")
    .eq("entry_date", date)
    .order("created_at", {
        ascending: true
    });

    if (error) {

        alert(
            "Unable to load details: " +
            error.message
        );

        return;
    }

    details.innerHTML = "";

    names.forEach(name => {

        const item =
        data.find(
            record =>
            record.name === name
        );

        const oldValue =
        item
        ? Number(item.old_rate)
        : 0;

        const newValue =
        item
        ? Number(item.new_rate)
        : 0;

        const profitLoss =
        newValue - oldValue;

        const box =
        document.createElement("div");

        box.className =
        "detail-box";

        box.innerHTML = `

            <div class="detail-name">
                ${name}
            </div>

            <div class="detail-row">

                <span>
                    Old Value
                </span>

                <strong>
                    ${format(oldValue)}
                </strong>

            </div>

            <div class="detail-row">

                <span>
                    New Value
                </span>

                <strong>
                    ${format(newValue)}
                </strong>

            </div>

            <div class="detail-row">

                <span>
                    Profit/Loss
                </span>

                <strong class="${
                    profitLoss >= 0
                    ? "positive"
                    : "negative"
                }">
                    ${format(profitLoss)}
                </strong>

            </div>

        `;

        details.appendChild(box);

    });

    details.style.display = "block";
}

async function editHistory(date) {

    const { data, error } = await client
        .from("records")
        .select("*")
        .eq("entry_date", date)
        .order("created_at", { ascending: true });

    if (error) {
        alert("Unable to load data for editing: " + error.message);
        return;
    }

    if (!data || data.length === 0) {
        alert("No records found for this date.");
        return;
    }

    // Load the selected date's saved values into the main form.
    document.getElementById("entryDate").value = date;

    const tbody = document.getElementById("dataBody");
    tbody.innerHTML = "";

    names.forEach(name => {
        const item = data.find(record => record.name === name);
        addRow(
            name,
            item ? Number(item.old_rate) : 0,
            item ? Number(item.new_rate) : 0
        );
    });

    document.getElementById("operationAmount").value = 0;
    document.getElementById("operation").value = "+";
    calculate();

    document.getElementById("status").textContent =
        "Editing " + date + " — make changes and click SAVE ENTRY.";

    // Bring the editable form into view.
    document.querySelector(".header").scrollIntoView({ behavior: "smooth" });
}

async function deleteHistory(date) {

    const confirmDelete =
    confirm(
        "Are you sure you want to delete all records for " +
        date +
        "?"
    );

    if (!confirmDelete) {
        return;
    }

    const { error } =
    await client
    .from("records")
    .delete()
    .eq("entry_date", date);

    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }

    alert(
        date +
        " history deleted successfully."
    );

    loadHistory();
}

function toggleHistory() {

    const history =
    document.getElementById("history");

    history.classList.toggle("hidden");

    if (
        !history.classList.contains("hidden")
    ) {
        loadHistory();
    }

}

</script>
</body>
